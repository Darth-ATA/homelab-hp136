# Immich - Self-hosted photo and video backup solution
# Docs: https://immich.app/docs
# Access: http://192.168.1.142:2283 (or via proxy)

services:
  immich:
    container_name: immich
    image: ghcr.io/immich-app/immich-server:release
    command: ['start.sh', 'immich']
    restart: unless-stopped
    ports:
      - "2283:3001"
    volumes:
      - /root/docker/immich/upload:/usr/src/app/upload
      - /root/docker/immich/library:/usr/src/app/library
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - TZ=Europe/Madrid
      - IMMICH_DB_PASSWORD=${IMMICH_DB_PASSWORD}
    depends_on:
      - immich-redis
      - immich-postgres

  immich-microservices:
    container_name: immich-microservices
    image: ghcr.io/immich-app/immich-server:release
    command: ['start.sh', 'microservices']
    restart: unless-stopped
    volumes:
      - /root/docker/immich/upload:/usr/src/app/upload
      - /root/docker/immich/library:/usr/src/app/library
      - /etc/localtime:/etc/localtime:ro
    environment:
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=immich
      - DB_PASSWORD=${IMMICH_DB_PASSWORD}
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
      - TZ=Europe/Madrid
      - IMMICH_DB_PASSWORD=${IMMICH_DB_PASSWORD}
    depends_on:
      - immich-redis
      - immich-postgres

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: unless-stopped
    volumes:
      - /root/docker/immich/redis:/cache

  immich-redis:
    container_name: immich-redis
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - /root/docker/immich/redis:/data

  immich-postgres:
    container_name: immich-postgres
    image: tensorchord/pgvecto-rs:pg16-v0.3.0
    restart: unless-stopped
    volumes:
      - /root/docker/immich/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${IMMICH_DB_PASSWORD}
      - POSTGRES_USER=immich
      - POSTGRES_DB=immich

