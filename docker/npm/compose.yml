# Nginx Proxy Manager
# Access: http://10.10.10.142:81 (or via proxy)
# Default login: admin@example.com / changeme (change on first login)
# network_mode: host required to reach LAN IPs (10.10.10.x)

services:
  app:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm-app
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt

# networks: (not needed with host mode)